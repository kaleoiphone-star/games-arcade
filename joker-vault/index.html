<!doctype html><html lang="en"><head><meta charset="utf-8"><script>/* Arcade sound fix for iPad/iPhone: play game sound even when the device is in silent mode,
   and wake the sound back up on the next tap after it has been interrupted (switching apps, a call, locking the screen). */
(function(){
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  var Orig=window.AudioContext||window.webkitAudioContext; if(!Orig) return;
  var ctxs=[];
  function ArcadeAudioContext(opts){ var c=(opts===undefined)?new Orig():new Orig(opts); ctxs.push(c); return c; }
  ArcadeAudioContext.prototype=Orig.prototype;
  try{ Object.setPrototypeOf(ArcadeAudioContext,Orig); }catch(e){}
  window.AudioContext=ArcadeAudioContext;
  if(window.webkitAudioContext) window.webkitAudioContext=ArcadeAudioContext;
  function wake(){
    try{ if(navigator.audioSession&&navigator.audioSession.type!=='playback') navigator.audioSession.type='playback'; }catch(e){}
    for(var i=0;i<ctxs.length;i++){ var c=ctxs[i];
      if(c.state!=='running'&&c.state!=='closed'){ try{ c.resume(); var b=c.createBufferSource(); b.buffer=c.createBuffer(1,1,22050); b.connect(c.destination); b.start(0); }catch(e){} } }
  }
  ['touchend','pointerup','click','keydown'].forEach(function(t){ window.addEventListener(t,wake,true); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) wake(); });
})();
</script>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Joker Vault Deluxe</title>
<style>
:root{
  color-scheme:dark;
  --ink:#f3efe0; --muted:#8fa6a3; --panel:rgba(13,25,29,.9); --panel2:#1c3036;
  --chips:#2d9cff; --mult:#ff4b4b; --gold:#ffc83d; --green:#2fcf7a; --purple:#a66bff; --pink:#ff3fa4; --cyan:#35e0ff;
  --ch:120px; --cw:85px; --jhRow:105px; --pw:54px; --appH:100vh;
  --sideW:clamp(232px,21vw,276px);
  --gap:clamp(5px,1vh,10px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:#060d0b;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,input{font:inherit;touch-action:manipulation}
.num{font-family:ui-monospace,"SF Mono",Menlo,"Courier New",monospace;font-weight:900}
.hidden{display:none!important}

/* ---------- BACKDROP & CRT ---------- */
#bg{position:fixed;inset:-50%;z-index:0;background:conic-gradient(from 0deg,#0f4a36,#123a52,#2e1546,#4a1a34,#0f4a36);filter:blur(90px) saturate(1.3);animation:spin 70s linear infinite;opacity:.55;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#grid{position:fixed;left:-20%;right:-20%;bottom:-10%;height:45%;z-index:0;pointer-events:none;opacity:.18;
  background-image:linear-gradient(rgba(255,63,164,.8) 1px,transparent 1px),linear-gradient(90deg,rgba(53,224,255,.8) 1px,transparent 1px);
  background-size:60px 60px;transform:perspective(400px) rotateX(62deg);transform-origin:bottom;animation:gridmove 4s linear infinite}
@keyframes gridmove{to{background-position:0 60px}}
#screen{position:fixed;left:0;top:0;width:100vw;height:var(--appH);z-index:1;overflow:hidden;
  padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
#fx{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
#crt{position:fixed;inset:0;pointer-events:none;z-index:95}
body.fx-scan #crt::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0 1px,transparent 1px 3px),
             repeating-linear-gradient(90deg,rgba(255,0,60,.025) 0 1px,rgba(0,255,120,.025) 1px 2px,rgba(0,80,255,.025) 2px 3px);
  animation:flicker 5s steps(60) infinite}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:.86}48%{opacity:1}72%{opacity:.93}}
body.fx-scan #crt .roll{position:absolute;left:0;right:0;height:18vh;background:linear-gradient(transparent,rgba(255,255,255,.035),transparent);animation:roll 7s linear infinite}
@keyframes roll{from{top:-20vh}to{top:110vh}}
body:not(.fx-scan) #crt .roll{display:none}
body.fx-curve #screen{border-radius:clamp(14px,3.2vmin,40px);transform:scale(.985)}
body.fx-curve #crt::after{content:"";position:absolute;inset:0;border-radius:clamp(14px,3.2vmin,40px);
  box-shadow:inset 0 0 7vmin 2vmin rgba(0,0,0,.92),inset 0 0 0 max(6px,.8vmin) #020403;
  background:radial-gradient(ellipse 60% 35% at 28% 12%,rgba(255,255,255,.07),transparent 70%),
             radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%)}
body:not(.fx-curve) #crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45))}
body.fx-chroma .chroma{text-shadow:-1.5px 0 rgba(255,40,100,.75),1.5px 0 rgba(40,220,255,.75)}
body.fx-chroma .card.scoring,body.fx-chroma .chroma-hit{filter:drop-shadow(-2.5px 0 rgba(255,40,100,.75)) drop-shadow(2.5px 0 rgba(40,220,255,.75))}

/* ---------- LAYOUT ---------- */
#app{display:grid;grid-template-columns:var(--sideW) minmax(0,1fr);gap:var(--gap);width:100%;height:100%;min-height:0}
.panel{background:var(--panel);border:2px solid #2a444a;border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.5),inset 0 0 30px rgba(0,0,0,.35)}

/* ---------- SIDE ---------- */
#side{display:flex;flex-direction:column;gap:var(--gap);padding:var(--gap);min-height:0;overflow:hidden}
.blindbox{grid-area:blind;border-radius:10px;padding:clamp(6px,1.2vh,12px);text-align:center;border:2px solid}
.blindbox.small{background:linear-gradient(#1c4f8f,#12365f);border-color:#4aa3ff}
.blindbox.big{background:linear-gradient(#8f5a1c,#5f3a12);border-color:#ffb04a}
.blindbox.boss{background:linear-gradient(#8f1c2e,#4a0c18);border-color:#ff4d6d;box-shadow:0 0 18px rgba(255,77,109,.45)}
.blindbox.boss.stashboss{background:linear-gradient(#4a1c8f,#220c4a);border-color:var(--purple);box-shadow:0 0 18px rgba(166,107,255,.55)}
.blindbox h3{margin:0;font-size:clamp(14px,2.2vh,20px);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 0 #0008}
.blindbox .bdesc{font-size:clamp(10px,1.5vh,12px);margin-top:3px;color:#ffe0e6;line-height:1.25}
.blindbox .target{margin-top:4px;font-size:clamp(10px,1.4vh,12px);color:#ddd}
.blindbox .target b{display:block;font-size:clamp(18px,3.4vh,28px);color:var(--mult);text-shadow:0 0 10px rgba(255,75,75,.5)}
.stat{background:var(--panel2);border-radius:10px;padding:clamp(4px,.8vh,8px) 10px;display:flex;justify-content:space-between;align-items:center;font-size:clamp(9px,1.4vh,12px);text-transform:uppercase;color:var(--muted);font-weight:700}
.stat b{font-size:clamp(16px,2.8vh,24px);color:var(--ink)}
.stat.score{grid-area:score}
.stat.score b{font-size:clamp(20px,3.6vh,30px);color:#fff}
.calc{grid-area:calc;background:#0a1417;border-radius:10px;padding:clamp(5px,1vh,10px);text-align:center;border:2px solid #243a40}
#handName{font-weight:900;min-height:1.3em;font-size:clamp(12px,2.1vh,18px);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#handName small{color:var(--muted);font-size:.75em}
.calcrow{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:4px}
.chipsbox,.multbox{flex:1;min-width:0;padding:clamp(3px,.7vh,6px) 8px;border-radius:8px;font-size:clamp(16px,3vh,26px);color:#fff;box-shadow:0 3px 0 #0008;overflow:hidden}
.chipsbox{background:var(--chips);text-align:right;box-shadow:0 3px 0 #0008,0 0 14px rgba(45,156,255,.45)}
.multbox{background:var(--mult);text-align:left;box-shadow:0 3px 0 #0008,0 0 14px rgba(255,75,75,.45)}
.calcrow .x{font-weight:900;color:var(--mult);font-size:clamp(16px,2.6vh,22px)}
#handTotal{margin-top:3px;min-height:1.2em;font-size:clamp(16px,2.8vh,24px);color:var(--gold);text-shadow:0 0 12px rgba(255,200,61,.6)}
.counters{grid-area:cnt;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.counters .stat{flex-direction:column;gap:1px}
.stat.hands b{color:var(--chips)} .stat.discards b{color:var(--mult)} .stat.money b{color:var(--gold)}
.piles{grid-area:piles;display:flex;justify-content:space-around;align-items:flex-end;gap:6px}
.pile{text-align:center}
.pile .lbl{font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.pile .cnt{font-size:11px;margin-top:3px;font-weight:900}
#deckPile,#discardPile{position:relative;width:var(--pw);height:calc(var(--pw)*1.4);margin:0 auto;--cw:var(--pw);--ch:calc(var(--pw)*1.4)}
.back{position:absolute;inset:0;border-radius:7px;border:2px solid #fff;background:repeating-linear-gradient(45deg,#c0303a 0 5px,#a4222c 5px 10px);box-shadow:0 3px 0 rgba(0,0,0,.5)}
.back::after{content:"🃏";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--pw)*.4)}
#discardPile .card{position:absolute;inset:0;cursor:default}
.emptypile{position:absolute;inset:0;border:2px dashed #ffffff30;border-radius:7px}
.audio{grid-area:audio;display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:10px;padding:0 6px 0 0}
.sidebtns{grid-area:btns;display:grid;grid-template-columns:repeat(4,minmax(50px,1fr));gap:4px;margin-top:auto}
.iconbtn{flex:none;min-width:50px;min-height:50px;border:none;border-radius:10px;background:#34474c;color:#fff;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.6);display:grid;place-items:center;padding:0}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.6)}
.iconbtn.on{background:#7b47d6}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:48px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--pink),var(--cyan))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 2px 6px #000}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--pink),var(--cyan))}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--gold);border:3px solid #fff}
.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.3)}}

/* ---------- MAIN ---------- */
#main{position:relative;display:flex;flex-direction:column;gap:var(--gap);min-width:0;min-height:0}
#jokerArea{flex:none;padding:6px;display:flex;flex-direction:column;gap:6px}
.zrow{display:flex;gap:6px;align-items:stretch}
.ztab{flex:none;width:clamp(40px,4.2vw,50px);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:11px;padding:4px 0}
.ztab span{writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.14em;font-size:clamp(9px,1.3vh,11px)}
.ztab em{font-style:normal;font-size:11px;background:#0008;border-radius:8px;padding:1px 4px}
.ztab.act{background:rgba(255,200,61,.12);color:var(--gold);border:2px solid rgba(255,200,61,.45)}
.ztab.stsh{background:rgba(166,107,255,.15);color:var(--purple);border:2px solid rgba(166,107,255,.55)}
.zone{flex:1;min-width:0;display:flex;gap:6px;padding:6px;border-radius:12px;height:calc(var(--jhRow) + 16px);align-items:center;overflow:hidden;--jw:calc(var(--jhRow)*.76);--jh:var(--jhRow);transition:box-shadow .2s}
#activeZone{background:rgba(255,200,61,.05);border:2px solid rgba(255,200,61,.35);box-shadow:inset 0 0 26px rgba(255,200,61,.08)}
#stashZone{background:repeating-linear-gradient(45deg,rgba(166,107,255,.07) 0 12px,rgba(0,0,0,.22) 12px 24px);border:2px dashed rgba(166,107,255,.6);box-shadow:inset 0 0 26px rgba(90,40,160,.35)}
body.phantom #stashZone{border-style:solid;box-shadow:inset 0 0 30px rgba(166,107,255,.6),0 0 18px rgba(166,107,255,.5)}
body.locksmith #stashZone{border-color:#c9c9c9;background:repeating-linear-gradient(135deg,rgba(200,200,200,.12) 0 6px,rgba(0,0,0,.3) 6px 18px)}
.zone.dragover{box-shadow:0 0 0 3px #fff,0 0 24px #fff!important}
.slot-empty{flex:none;width:var(--jw);height:var(--jh);border-radius:10px;border:2px dashed #ffffff30;display:grid;place-items:center;font-size:max(8px,calc(var(--jw)*.1));font-weight:900;letter-spacing:.1em;color:#ffffff40}
#stashZone .slot-empty{border-color:#a66bff55;color:#a66bff80}

/* ---------- JOKERS ---------- */
.joker{flex:none;width:var(--jw);height:var(--jh);border-radius:max(6px,calc(var(--jw)*.1));background:linear-gradient(160deg,#fff8e4,#e6d5aa);color:#2a1f10;border:3px solid;padding:calc(var(--jw)*.05) calc(var(--jw)*.04);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:grab;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.55);transition:box-shadow .2s,filter .3s;touch-action:none;overflow:visible}
@media (hover:hover){.joker:hover{filter:brightness(1.08)}}
.joker.common{border-color:#3fa7ff} .joker.uncommon{border-color:#2fcf7a} .joker.rare{border-color:#ff4d6d}
.joker.legendary{border-color:#ffd24a;animation:legend 2.4s linear infinite}
@keyframes legend{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.55),0 0 14px #ffd24a}33%{box-shadow:0 4px 0 rgba(0,0,0,.55),0 0 14px var(--pink)}66%{box-shadow:0 4px 0 rgba(0,0,0,.55),0 0 14px var(--cyan)}}
.joker.rare:not(.gen){background:linear-gradient(160deg,#fff1f3,#f0c9b0)}
.joker.gen{background:linear-gradient(160deg,hsl(var(--hue),85%,90%),hsl(calc(var(--hue) + 55),70%,72%))}
.joker.gen::before{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(0deg,rgba(255,255,255,.14) 0 2px,transparent 2px 5px);pointer-events:none}
.joker .jart{font-size:calc(var(--jw)*.34);line-height:1.1;filter:drop-shadow(0 2px 0 #0003)}
.joker.gen .jart{color:hsl(var(--hue),70%,26%);text-shadow:0 0 8px hsla(var(--hue),90%,60%,.8)}
.joker .jname{font-weight:900;font-size:max(7px,calc(var(--jw)*.108));text-align:center;line-height:1.05;text-transform:uppercase}
.joker .jdesc{font-size:max(7px,calc(var(--jw)*.088));text-align:center;line-height:1.15;color:#3e2f1a;overflow:hidden;flex:1}
.joker .jdesc em{color:#b0302f;font-style:normal;font-weight:700}
.zone.compact .joker .jdesc{display:none}
.zone.tiny .joker .jname{display:none}
.joker .aibadge{position:absolute;top:-7px;left:-7px;background:linear-gradient(135deg,var(--pink),var(--cyan));color:#fff;font-size:9px;font-weight:900;border-radius:6px;padding:1px 4px;box-shadow:0 2px 0 #0008}
.joker .sigil{position:absolute;bottom:2px;right:4px;font-size:max(9px,calc(var(--jw)*.13));font-weight:900;opacity:.8}
.joker .sigil.r{color:#c8202d} .joker .sigil.b{color:#1f2b3c}
.joker.jsel{box-shadow:0 0 0 3px var(--gold),0 0 22px var(--gold),0 4px 0 rgba(0,0,0,.55)}
.joker.dormant{filter:saturate(.3) brightness(.75)}
.joker.phantom-live{box-shadow:0 0 0 3px var(--purple),0 0 22px var(--purple)}
.joker .lock{position:absolute;top:-8px;right:-8px;background:var(--purple);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px;box-shadow:0 2px 0 #0008}
.joker.inert{filter:grayscale(1) brightness(.45)}
.joker .stlbl{position:absolute;left:-3px;right:-3px;top:40%;text-align:center;font-weight:900;color:#fff;background:#000c;font-size:max(8px,calc(var(--jw)*.1));padding:2px 0;letter-spacing:.06em}
.joker.chained{filter:saturate(.2) brightness(.7)}
.joker.chained::after{content:"⛓";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--jw)*.5);color:#ddd;text-shadow:0 0 8px #000;pointer-events:none}
.joker.swap-target{animation:swapPulse 1s infinite}
@keyframes swapPulse{50%{box-shadow:0 0 0 3px #fff,0 0 22px #fff}}
.joker.arrive-stash{animation:arriveStash .8s ease}
.joker.arrive-active{animation:arriveActive .8s ease}
@keyframes arriveStash{0%{box-shadow:0 0 0 6px var(--purple),0 0 40px var(--purple)}}
@keyframes arriveActive{0%{box-shadow:0 0 0 6px var(--gold),0 0 40px var(--gold)}}
.ghost{position:fixed;z-index:80;pointer-events:none;opacity:.92;box-shadow:0 18px 30px rgba(0,0,0,.6),0 0 24px var(--cyan)!important}

#jokerActions{position:absolute;left:0;right:0;z-index:30;display:none;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(8,16,19,.97);border:2px solid var(--gold);border-radius:12px;padding:8px 10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.7)}
#jokerActions.show{display:flex}
#jokerActions.swap{border-color:#fff}
.ja-info{flex:1;min-width:200px;line-height:1.3}
.ja-info b{font-size:15px}
.ja-btns{display:flex;gap:6px;flex-wrap:wrap}
.rar{font-size:10px;padding:1px 6px;border-radius:10px;text-transform:uppercase;font-weight:900;margin-left:4px;color:#fff}
.rar.common{background:#3fa7ff} .rar.uncommon{background:#23a765} .rar.rare{background:#e0364f} .rar.legendary{background:linear-gradient(90deg,#ffb300,var(--pink));}

/* ---------- PLAY / HAND ---------- */
#playArea{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:radial-gradient(ellipse at center,rgba(40,110,80,.45),rgba(12,40,30,.6));border-color:#2d5a48}
#playHint{position:absolute;top:6px;left:0;right:0;text-align:center;font-size:clamp(9px,1.4vh,12px);color:#b7d8c6;letter-spacing:.08em;text-transform:uppercase;font-weight:900;opacity:.75;pointer-events:none;padding:0 8px}
#playZone{flex:1;display:flex;justify-content:center;align-items:center;gap:8px;min-height:0}
#handArea{flex:none;height:calc(var(--ch)*1.24 + 14px);display:flex;align-items:flex-end;justify-content:center;padding:0 8px 8px}
#hand{display:flex;gap:6px;justify-content:center;align-items:flex-end;touch-action:none;min-height:var(--ch)}
#controls{flex:none;display:flex;justify-content:center;gap:8px;flex-wrap:nowrap}
#controls .btn{flex:1 1 auto;max-width:220px;min-height:50px;padding:8px 10px}

.card{width:var(--cw);height:var(--ch);flex:0 0 auto;border-radius:max(5px,calc(var(--cw)*.1));background:linear-gradient(170deg,#fffdf4,#ece4cd);border:2px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.5);position:relative;top:0;cursor:pointer;transition:top .15s ease,box-shadow .15s,opacity .3s,filter .3s}
.card.red{color:#d42f3b} .card.black{color:#1f2b3c}
.card.sel{top:calc(var(--ch) * -0.2);box-shadow:0 0 0 3px var(--gold),0 0 18px var(--gold),0 4px 0 rgba(0,0,0,.5)}
.corner{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.9;font-weight:900}
.corner b{font-size:calc(var(--cw)*.24)} .corner i{font-style:normal;font-size:calc(var(--cw)*.2)}
.tl{top:4%;left:6%} .br{bottom:4%;right:6%;transform:rotate(180deg)}
.pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.5)}
.pip.ace{font-size:calc(var(--cw)*.72)}
.pip.face{margin:22% 18%;border-radius:5px;background:linear-gradient(160deg,#ffe7a8,#f2b8a0);border:2px solid currentColor;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:calc(var(--cw)*.3);line-height:1}
.pip.face span:first-child{font-size:calc(var(--cw)*.4);font-weight:900}
.card.debuffed::after{content:"✖";position:absolute;inset:0;border-radius:inherit;background:rgba(30,30,30,.55);display:grid;place-items:center;color:#ff5a5a;font-size:calc(var(--cw)*.6);font-weight:900}

<script>
'use strict';
/* =====================================================================
   1. UTILITIES & SETTINGS
   ===================================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const SAVE_KEY = 'jokerVault.deluxe.save', SET_KEY = 'jokerVault.deluxe.settings', REC_KEY = 'jokerVault.deluxe.records';
const Settings = Object.assign({scan:true, curve:true, chroma:true, particles:true, shake:true, volume:0.7, muted:false, speed:1}, store.get(SET_KEY, {}));
const saveSettings = () => store.set(SET_KEY, Settings);
const wait = ms => sleep(ms / Settings.speed);
let uidN = Date.now();
const uid = () => 'u' + (uidN++).toString(36);
const rand = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rand(a, b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
function wpick(items, wf){ const tot = items.reduce((s,x)=>s+wf(x),0); let r = Math.random()*tot; for(const x of items){ r -= wf(x); if(r <= 0) return x; } return items[items.length-1]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const fmt = n => Math.floor(n).toLocaleString('en-US');
const fmtMult = m => Number.isInteger(m) ? String(m) : (Math.round(m*100)/100).toString();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const round2 = x => Math.round(x*100)/100;

/* =====================================================================
   2. WEB AUDIO SYNTH ENGINE (no audio files)
   ===================================================================== */
const SFX = {
  ctx:null, out:null, noiseBuf:null,
  init(){
    if(this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    this.ctx = new AC();
    this.out = this.ctx.createGain();
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .2;
    this.out.connect(comp); comp.connect(this.ctx.destination);
    const len = this.ctx.sampleRate;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this.applyVolume(); return true;
  },
  unlock(){
    if(!this.init()) return;
    if(this.ctx.state === 'suspended') this.ctx.resume();
    // iOS: play a silent buffer inside the gesture to fully unlock output
    const b = this.ctx.createBufferSource(); b.buffer = this.ctx.createBuffer(1,1,22050); b.connect(this.ctx.destination); b.start(0);
  },
  applyVolume(){ if(this.out) this.out.gain.value = Settings.muted ? 0 : Math.pow(Settings.volume, 1.6) * 0.9; },
  ready(){ return this.ctx && this.ctx.state === 'running' && !Settings.muted && Settings.volume > 0; },
  tone(o){
    const c = this.ctx, t = c.currentTime + (o.at||0), dur = o.dur||.1;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f||440, t);
    if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2), t+dur);
    if(o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? .2 : o.vol;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + (o.a||.005));
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let node = osc;
    if(o.filter){
      const fl = c.createBiquadFilter(); fl.type = o.filter.type || 'lowpass';
      fl.frequency.setValueAtTime(o.filter.f, t);
      if(o.filter.f2) fl.frequency.exponentialRampToValueAtTime(o.filter.f2, t+dur);
      fl.Q.value = o.filter.q || 1; osc.connect(fl); node = fl;
    }
    node.connect(g); g.connect(this.out); osc.start(t); osc.stop(t + dur + .05);
  },
  noise(o){
    const c = this.ctx, t = c.currentTime + (o.at||0), dur = o.dur||.2;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    const fl = c.createBiquadFilter(); fl.type = o.type || 'bandpass';
    fl.frequency.setValueAtTime(o.f||1200, t); fl.frequency.exponentialRampToValueAtTime(o.f2||300, t+dur); fl.Q.value = o.q||1;
    const g = c.createGain(); g.gain.setValueAtTime(o.vol||.2, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    s.connect(fl); fl.connect(g); g.connect(this.out); s.start(t); s.stop(t+dur+.02);
  },
  note: n => 261.63 * Math.pow(2, n/12)
};
const PENTA = [0,2,4,7,9,12,14,16,19,21,24,26,28,31];
const SOUNDS = {
  select(){ SFX.tone({f:660,f2:990,dur:.06,vol:.14}); SFX.tone({type:'triangle',f:1320,dur:.05,vol:.07,at:.02}); },
  unselect(){ SFX.tone({f:560,f2:360,dur:.07,vol:.11}); },
  deal(i=0){ SFX.tone({type:'triangle',f:420+i*35,f2:260+i*35,dur:.05,vol:.07}); SFX.noise({dur:.04,vol:.05,f:4000,f2:2500}); },
  play(){ SFX.noise({dur:.18,vol:.12,f:900,f2:3000}); SFX.tone({type:'triangle',f:220,f2:440,dur:.15,vol:.12}); },
  card(i=0){ const f = SFX.note(PENTA[Math.min(i,PENTA.length-1)]+12);
    SFX.tone({f, dur:.14, vol:.13}); SFX.tone({type:'triangle', f:f/2, dur:.18, vol:.12}); SFX.tone({type:'square', f:f*2, dur:.05, vol:.04, at:.03}); },
  joker(i=0){ const p = Math.pow(2, ((i%6)*2)/12);
    SFX.tone({type:'sawtooth', f:110*p, dur:.38, vol:.2, a:.02, filter:{f:280, f2:2400, q:6}});
    SFX.tone({type:'sine', f:55*p, dur:.45, vol:.32, a:.01});
    SFX.tone({type:'triangle', f:220*p, dur:.22, vol:.08, detune:7}); },
  xmult(i=0){ SOUNDS.joker(i); SFX.tone({f:1760,f2:2640,dur:.12,vol:.08,at:.05}); SFX.tone({type:'sawtooth',f:880,dur:.2,vol:.06,at:.08,filter:{f:3000,f2:600}}); },
  coin(){ SFX.tone({f:988,dur:.08,vol:.12}); SFX.tone({f:1319,dur:.3,vol:.12,at:.08}); },
  buy(){ SOUNDS.coin(); SFX.tone({type:'triangle',f:2637,dur:.25,vol:.07,at:.16}); SFX.tone({type:'triangle',f:3136,dur:.25,vol:.05,at:.22}); },
  total(big){ const base = big ? 0 : -5;
    [0,4,7,12].forEach((n,i)=>SFX.tone({type:'square',f:SFX.note(n+base+12),dur:.18,vol:.1,at:i*.05}));
    SFX.tone({type:'sawtooth',f:SFX.note(base-12),dur:.5,vol:.14,filter:{f:600,f2:2000}});
    if(big) SFX.noise({dur:.6,vol:.12,f:6000,f2:800,type:'highpass'}); },
  fanfare(){ const seq = [[0,.0],[4,.11],[7,.22],[12,.33],[7,.44],[12,.55]];
    seq.forEach(([n,t])=>{ SFX.tone({f:SFX.note(n+12),dur:.14,vol:.12,at:t}); SFX.tone({type:'triangle',f:SFX.note(n),dur:.14,vol:.1,at:t}); });
    [0,4,7,12,16].forEach(n=>SFX.tone({type:'sawtooth',f:SFX.note(n+12),dur:.9,vol:.06,at:.7,filter:{f:900,f2:3500}}));

const COL = {chips:'45,156,255', mult:'255,75,75', gold:'255,200,61', purple:'166,107,255', green:'47,207,122', pink:'255,63,164', cyan:'53,224,255', fire:'255,120,30', white:'255,255,255'};
const FX = {
  cv:null, cx:null, parts:[], rings:[], running:false, dpr:1,
  init(){ this.cv = $('#fx'); this.cx = this.cv.getContext('2d'); this.resize(); },
  resize(){ this.dpr = Math.min(2, window.devicePixelRatio||1); this.cv.width = innerWidth*this.dpr; this.cv.height = innerHeight*this.dpr; this.cv.style.width = innerWidth+'px'; this.cv.style.height = innerHeight+'px'; },
  burst(x, y, color, n=16, spd=5){
    if(!Settings.particles) return;
    n = Math.min(n, 60);
    for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = rand(.3,1)*spd;
      this.parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-1.4, life:1, decay:rand(.014,.03), size:rand(1.8,4.2), color}); }
    this.rings.push({x, y, r:6, life:1, color});
    if(this.parts.length > 600) this.parts.splice(0, this.parts.length-600);
    this.start();
  },
  start(){ if(!this.running){ this.running = true; requestAnimationFrame(()=>this.loop()); } },
  loop(){
    const c = this.cx, d = this.dpr;
    c.setTransform(d,0,0,d,0,0); c.clearRect(0,0,innerWidth,innerHeight);
    c.globalCompositeOperation = 'lighter';
    for(const p of this.parts){
      p.x += p.vx; p.y += p.vy; p.vy += .11; p.vx *= .985; p.life -= p.decay;
      if(p.life <= 0) continue;
      c.fillStyle = `rgba(${p.color},${p.life*.16})`; c.beginPath(); c.arc(p.x, p.y, p.size*3.2, 0, 6.283); c.fill();
      c.fillStyle = `rgba(${p.color},${Math.min(1,p.life*1.2)})`; c.beginPath(); c.arc(p.x, p.y, p.size*Math.max(.3,p.life), 0, 6.283); c.fill();
    }
    for(const r of this.rings){
      r.r += 3.2; r.life -= .045; if(r.life <= 0) continue;
      c.strokeStyle = `rgba(${r.color},${r.life*.9})`; c.lineWidth = 3*r.life; c.beginPath(); c.arc(r.x, r.y, r.r, 0, 6.283); c.stroke();
    }
    this.parts = this.parts.filter(p=>p.life > 0); this.rings = this.rings.filter(r=>r.life > 0);
    if(this.parts.length || this.rings.length) requestAnimationFrame(()=>this.loop());
    else { this.running = false; c.clearRect(0,0,innerWidth,innerHeight); }
  }
};
function burstAt(el, color, n, spd){ if(!el) return; const r = el.getBoundingClientRect(); FX.burst(r.left+r.width/2, r.top+r.height/2, color, n, spd); }

  const kind = wpick(kinds, k=>k[1])[0];

  return {kind, val};

  alchemy:{w:2, theme:['Alchemist','Transmuter','Dyer'],

      hand:(c,j)=>j[K]>0?{chips:j[K]}:null,

const SCORING_TPLS = ['cond','suit','rank','emptyStash','stashSuits','stashCount','stashFull','rest','momentum','hibernate'];
function materialize(spec){
  const t = TIER[spec.rarity];
  const parts = spec.parts.map((x,i)=>TEMPLATES[x.tpl].make(x.p, t, 'v'+i));
  const combine = key => { const fs = parts.filter(p=>p[key]).map(p=>p[key]); if(!fs.length) return undefined;
    return (...a) => { const out = []; for(const f of fs){ const r = f(...a); if(r) out.push(r); } return out.length ? out : null; }; };
  const def = {id:spec.id, gen:true, spec, name:spec.name, art:spec.glyph, rarity:spec.rarity, cost:COST[spec.rarity], sigil:spec.sigil, hue:spec.hue, serial:spec.serial,
    desc:parts.map(p=>p.desc).join(' ✦ ')};
  def.card = combine('card'); def.hand = combine('hand'); def.after = combine('after');
  const ticks = parts.filter(p=>p.tick);
  if(ticks.length) def.tick = (j,z) => ticks.map(p=>p.tick(j,z)).filter(Boolean).join(' ') || null;
  const mv = parts.filter(p=>p.onMove);
  if(mv.length) def.onMove = (j,z) => mv.forEach(p=>p.onMove(j,z));
  const dy = parts.filter(p=>p.dyn);
  if(dy.length) def.dyn = j => dy.map(p=>p.dyn(j)).join(' ');
  JK[def.id] = def;
  return def;
}
function generateJoker(weights){
  const rarity = wpick(RARITY_ORDER, r=>weights[r]||0);
  const t = TIER[rarity], ri_ = RARITY_ORDER.indexOf(rarity);
  const avail = Object.keys(TEMPLATES).filter(k=>!TEMPLATES[k].min || ri_ >= RARITY_ORDER.indexOf(TEMPLATES[k].min));
  const tpl1 = wpick(rarity==='legendary' ? avail.filter(k=>SCORING_TPLS.includes(k)) : avail, k=>TEMPLATES[k].w);
  const parts = [{tpl:tpl1, p:TEMPLATES[tpl1].roll(t)}];
  if(rarity==='legendary'){
    const tpl2 = wpick(avail.filter(k=>k!==tpl1), k=>TEMPLATES[k].w);
    parts.push({tpl:tpl2, p:TEMPLATES[tpl2].roll(t*.7)});
  }
  const theme = TEMPLATES[tpl1].theme;
  const noun = theme && Math.random() < .6 ? pick(theme) : pick(GEN.nouns);
  const spec = {id:'g_'+uid(), name:`${pick(GEN.prefixes)} ${noun}`, rarity, hue:ri(0,359), glyph:pick(GEN.glyphs), sigil:pick(SUIT_ORDER),
                serial:Math.floor(Math.random()*4096).toString(16).toUpperCase().padStart(3,'0'), parts};
  return materialize(spec);
}

/* =====================================================================
   7. HAND EVALUATION
   ===================================================================== */
function evaluate(cards){
  const n = cards.length, byRank = {};
  for(const c of cards) (byRank[c.rank] = byRank[c.rank] || []).push(c);
  const groups = Object.values(byRank).sort((a,b)=>b.length-a.length || b[0].rank-a[0].rank);
  const flush = n===5 && cards.every(c=>c.suit===cards[0].suit);
  let straight = false;
  if(n===5 && groups.length===5){ const r = cards.map(c=>c.rank).sort((a,b)=>a-b); straight = (r[4]-r[0]===4) || r.join(',')==='2,3,4,5,14'; }
  const g0 = groups[0].length, g1 = groups[1] ? groups[1].length : 0;
  const has = {pair:g0>=2, twopair:g0>=2&&g1>=2, three:g0>=3, four:g0>=4, straight, flush, fullhouse:g0===3&&g1===2};
  let type, scoring;
  if(straight && flush){ type='Straight Flush'; scoring=cards; }
  else if(g0===4){ type='Four of a Kind'; scoring=groups[0]; }
  else if(g0===3 && g1===2){ type='Full House'; scoring=cards; }
  else if(flush){ type='Flush'; scoring=cards; }
  else if(straight){ type='Straight'; scoring=cards; }
  else if(g0===3){ type='Three of a Kind'; scoring=groups[0]; }
  else if(g0===2 && g1===2){ type='Two Pair'; scoring=[...groups[0],...groups[1]]; }
  else if(g0===2){ type='Pair'; scoring=groups[0]; }
  else { type='High Card'; scoring=[cards.reduce((a,b)=>b.rank>a.rank?b:a)]; }
  return {type, scoring, has};
}

function flip(fn){

    const step = now=>{
      const p = Math.min(1,(now-t0)/ms), e = 1-Math.pow(1-p,3);

      if(p<1) requestAnimationFrame(step); else res();
    };
    requestAnimationFrame(step);
  });
}

function sortHand(){
  if(S.sort==='rank') S.hand.sort((a,b)=>b.rank-a.rank || SUIT_ORDER.indexOf(a.suit)-SUIT_ORDER.indexOf(b.suit));
  else S.hand.sort((a,b)=>SUIT_ORDER.indexOf(a.suit)-SUIT_ORDER.indexOf(b.suit) || b.rank-a.rank);
}
function renderHand(){
  sortHand();
  $('#hand').innerHTML = S.hand.map(c=>cardHTML(c, S.selected.has(c.id)?'sel':'')).join('');
  renderControls(); updatePreview();
}
function renderPlay(){
  $('#playZone').innerHTML = S.played.map(c=>cardHTML(c, curScoring ? (curScoring.has(c.id) ? 'scoring' : 'dim') : '')).join('');
  $('#playHint').style.display = S.played.length ? 'none' : '';
}
function renderPiles(){
  $('#deckPile').innerHTML = S.deck.length ? '<div class="back"></div>' : '<div class="emptypile"></div>';
  $('#deckCount').textContent = `${S.deck.length}/${S.fullDeck.length}`;
  const top = S.discardPile.slice(-3);
  $('#discardPile').innerHTML = top.length
    ? top.map((c,i)=>`<div style="position:absolute;inset:0;transform:rotate(${(i-1)*7}deg)">${cardHTML(c).replace(/data-flip="[^"]*"/,'').replace(/data-card="[^"]*"/,'')}</div>`).join('')
    : '<div class="emptypile"></div>';
  $('#discardCount').textContent = S.discardPile.length;
}
function renderControls(){
  const inPlay = S.phase==='play' && !locked, n = S.selected.size;
  $('#playBtn').disabled = !inPlay || n===0 || S.hands<=0;
  $('#discardBtn').disabled = !inPlay || n===0 || S.discards<=0;
  $('#discardBtn').textContent = `Discard (${S.discards})`;
  const rb = $('#rerollHandBtn');
  rb.textContent = `Reroll (${S.rerollTokens})`;
  rb.disabled = !inPlay || S.rerollTokens<=0 || S.deck.length===0;
  $('#sortRankBtn').style.outline = S.sort==='rank' ? '2px solid #fff' : '';
  $('#sortSuitBtn').style.outline = S.sort==='suit' ? '2px solid #fff' : '';
}
function setCalc(name, chips, mult){ $('#handName').innerHTML = name || '&nbsp;'; $('#chipsVal').textContent = fmt(chips); $('#multVal').textContent = fmtMult(mult); }
function updatePreview(){
  if(locked || S.phase!=='play') return;
  const sel = S.hand.filter(c=>S.selected.has(c.id));
  $('#handTotal').textContent = '';
  if(!sel.length){ setCalc('<small>Select up to 5 cards</small>',0,0); return; }
  const ev = evaluate(sel), b = handBase(ev.type);
  setCalc(`${ev.type} <small>lvl.${S.levels[ev.type]}</small>`, b.chips, b.mult);
}
function renderAll(){ renderSide(); renderJokers(); renderHand(); renderPlay(); renderPiles(); }
function showView(v){
  $('#playArea').classList.toggle('hidden', v!=='play');
  $('#handArea').classList.toggle('hidden', v!=='play');
  $('#controls').classList.toggle('hidden', v!=='play');
  $('#cashArea').classList.toggle('hidden', v!=='cash');
  $('#shopArea').classList.toggle('hidden', v!=='shop');
}

/* =====================================================================
   10. ROUND FLOW
   ===================================================================== */
function startRun(){
  store.del(SAVE_KEY);
  S = newState(); locked = false; selectedJoker = null; swapPending = null; curScoring = null;
  closeModal();
  startRound();
}
function startRound(){
  S.phase = 'play'; selectedJoker = null; swapPending = null; curScoring = null;
  const b = activeBoss();
  S.hands = S.maxHands;
  S.discards = (b && b.water) ? 0 : S.maxDiscards;
  S.deck = shuffle(S.fullDeck.slice()); S.hand = []; S.played = []; S.discardPile = [];
  S.selected.clear(); S.roundScore = 0;
  showView('play'); fitLayout(); renderAll(); setCalc('',0,0); $('#handTotal').textContent = '';
  if(b){
    sfx('boss'); toast(`${b.icon} BOSS — ${b.name}: ${b.desc}`, 4200);
    const bb = $('#blindBox'); bb.classList.add('shake'); setTimeout(()=>bb.classList.remove('shake'), 500);
    burstAt(bb, b.stash ? COL.purple : COL.mult, 40, 7);
  }
  drawCards();
}
function drawCards(){
  flip(()=>{
    while(S.hand.length < S.handSize && S.deck.length) S.hand.push(S.deck.pop());
    renderHand(); renderPiles(); renderJokers();
  });
}
function setSel(id, on){
  if(on === S.selected.has(id)) return;
  if(on && S.selected.size >= 5){ toast('You can select up to 5 cards'); sfx('error'); return; }
  on ? S.selected.add(id) : S.selected.delete(id);
  const el = document.querySelector(`#hand [data-card="${id}"]`);
  if(el) el.classList.toggle('sel', on);
  sfx(on ? 'select' : 'unselect');
  renderControls(); updatePreview();
}

function normEff(r){ return !r ? [] : Array.isArray(r) ? r : [r]; }
function applyEffect(acc, r){
  if(r.chips) acc.chips += r.chips;
  if(r.mult) acc.mult += r.mult;
  if(r.xmult) acc.mult *= r.xmult;
  if(r.money){ S.money += r.money; $('#moneyVal').textContent = '$'+S.money; popEl($('#moneyVal')); }
}
function effectLabel(r){
  if(r.xmult) return ['×'+r.xmult+' Mult','xmult', COL.pink];
  if(r.mult) return ['+'+r.mult+' Mult','mult', COL.mult];
  if(r.chips) return ['+'+r.chips,'chips', COL.chips];
  if(r.money) return ['+$'+r.money,'money', COL.gold];
  return ['','info', COL.white];
}
let jokerFireCount = 0;
async function triggerJoker(j, r, acc){
  applyEffect(acc, r);
  const el = jokerEl(j.uid);
  wiggle(el); chromaHit(el);
  const [txt, cls, col] = effectLabel(r);
  floatText(el, txt, cls); burstAt(el, col, 14, 4.5);
  if(r.xmult) sfx('xmult', jokerFireCount++); else if(r.money) sfx('coin'); else sfx('joker', jokerFireCount++);
  $('#chipsVal').textContent = fmt(acc.chips); $('#multVal').textContent = fmtMult(acc.mult);
  if(r.chips) bump($('#chipsVal')); if(r.mult||r.xmult) bump($('#multVal'));
  await wait(380);
}

async function playHand(){
  if(locked || S.phase!=='play') return;
  const sel = S.hand.filter(c=>S.selected.has(c.id));
  if(!sel.length || S.hands<=0) return;
  const boss = activeBoss();
  if(boss && boss.psychic && sel.length!==5){ toast('👁 The Psychic demands exactly 5 cards'); sfx('error'); const bb=$('#blindBox'); bb.classList.add('shake'); setTimeout(()=>bb.classList.remove('shake'),450); return; }

  locked = true; selectedJoker = null; swapPending = null; jokerFireCount = 0;
  S.hands--; S.handsPlayed++;
  $('#handsVal').textContent = S.hands; popEl($('#handsVal'));
  sfx('play');
  flip(()=>{ S.played = sel; S.hand = S.hand.filter(c=>!S.selected.has(c.id)); S.selected.clear(); renderHand(); renderPlay(); renderJokers(); });
  renderControls();
  await wait(480);

  if(boss && boss.taxman) await collectRent();

  const ev = evaluate(S.played), base = handBase(ev.type);
  const acc = {chips:base.chips, mult:base.mult};
  setCalc(`${ev.type} <small>lvl.${S.levels[ev.type]}</small>`, acc.chips, acc.mult); popEl($('#handName'));
  curScoring = new Set(ev.scoring.map(c=>c.id));
  S.played.forEach(c=>{ if(!curScoring.has(c.id)) cardEl(c)?.classList.add('dim'); });
  await wait(400);

  const live = liveJokers();
  const ctx = {type:ev.type, has:ev.has, played:S.played, scoring:ev.scoring, handIndex:S.maxHands - S.hands - 1};
  let step = 0;
  for(const c of S.played.slice()){
    if(!curScoring.has(c.id)) continue;
    const el = cardEl(c);
    el?.classList.add('scoring');
    el?.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(-14px) scale(1.18)'},{transform:'translateY(0) scale(1)'}],{duration:300/Settings.speed});
    if(isDebuffed(c)){ floatText(el,'Debuffed','info'); sfx('error'); await wait(380); continue; }
    const v = cardChips(c.rank);
    acc.chips += v; floatText(el, '+'+v, 'chips'); burstAt(el, COL.chips, 12, 4);
    sfx('card', step++);
    $('#chipsVal').textContent = fmt(acc.chips); bump($('#chipsVal'));
    await wait(340);
    for(const j of live){ const d = JK[j.id]; if(!d || !d.card) continue;
      for(const r of normEff(d.card(ctx, c, j))) await triggerJoker(j, r, acc); }
  }
  for(const j of live){ const d = JK[j.id]; if(!d || !d.hand) continue;
    for(const r of normEff(d.hand(ctx, j))) await triggerJoker(j, r, acc); }

  const total = Math.floor(acc.chips * acc.mult);
  const target = blindInfo().target;
  S.bestHand = Math.max(S.bestHand, total);
  const tEl = $('#handTotal'); tEl.textContent = fmt(total); bump(tEl, 1.4);
  const big = total >= target*.5;
  sfx('total', big);
  burstAt($('#roundScore'), COL.gold, big ? 50 : 22, big ? 8 : 5);
  if(big){ screenShake(); burstAt(tEl, COL.pink, 30, 7); }
  await wait(420);
  const from = S.roundScore; S.roundScore += total;
  await animateNumber($('#roundScore'), from, S.roundScore, 650);
  popEl($('#roundScore'));

  // card destruction / transformation effects
  for(const j of live){ const d = JK[j.id]; if(!d || !d.after) continue;
    const ops = normEff(d.after(ctx, j)); if(ops.length) await applyOps(j, ops); }

  // turn-based scaling ticks for every owned joker, depending on where it rests
  for(const [arr, zone] of [[S.active,'active'],[S.stash,'stash']]){
    for(const j of arr){ const d = JK[j.id]; if(!d || !d.tick) continue;
      const lbl = d.tick(j, zone); if(lbl){ const el = jokerEl(j.uid); floatText(el, lbl, zone==='stash'?'stash':'active'); burstAt(el, zone==='stash'?COL.purple:COL.gold, 8, 3); } }
  }
  await wait(250);

  await flyTo(S.played.map(cardEl), $('#discardPile'));
  S.discardPile.push(...S.played); S.played = []; curScoring = null;
  renderPlay(); renderPiles(); renderJokers(); $('#handTotal').textContent = '';

  if(S.roundScore >= target){ locked = false; await wait(250); winRound(); return; }
  if(boss && boss.void) await voidDrain();
  if(S.hands <= 0){ locked = false; gameOver(); return; }
  locked = false;
  drawCards();
  if(!S.hand.length){ gameOver(); return; }
  renderControls(); updatePreview();
}

async function applyOps(j, ops){
  const jel = jokerEl(j.uid);
  for(const op of ops){
    if(op.transform && op.transform.length){
      wiggle(jel); floatText(jel, op.label || 'Transform!', 'green'); sfx('transform'); burstAt(jel, COL.green, 12, 4);
      const els = op.transform.map(t=>cardEl(t.card)).filter(Boolean);
      await Promise.all(els.map(el=>el.animate([{transform:'scaleX(1)'},{transform:'scaleX(0)'}],{duration:170/Settings.speed,fill:'forwards'}).finished));
      op.transform.forEach(t=>{ if(t.rank) t.card.rank = t.rank; if(t.suit) t.card.suit = t.suit; });
      renderPlay();
      op.transform.forEach(t=>{ const el = cardEl(t.card); if(el){ el.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:220/Settings.speed}); burstAt(el, COL.green, 12, 4); } });
      await wait(380);
    }
    if(op.destroy && op.destroy.length){
      let victims = op.destroy.filter(c=>S.played.includes(c));
      const room = Math.max(0, S.fullDeck.length - MIN_DECK);
      if(victims.length > room) victims = victims.slice(0, room);
      if(!victims.length){ floatText(jel, `Deck at minimum (${MIN_DECK})`, 'info'); continue; }
      wiggle(jel); sfx('burn');
      await Promise.all(victims.map(c=>{ const el = cardEl(c); if(!el) return null; burstAt(el, COL.fire, 26, 5);
        return el.animate([{transform:'scale(1)',filter:'brightness(1)',opacity:1},{transform:'scale(1.1) rotate(4deg)',filter:'brightness(2) sepia(1) saturate(4) hue-rotate(-20deg)',opacity:1,offset:.4},{transform:'scale(.2) rotate(-12deg)',filter:'brightness(3)',opacity:0}],{duration:560/Settings.speed,fill:'forwards'}).finished; }));
      const ids = new Set(victims.map(c=>c.id));
      S.played = S.played.filter(c=>!ids.has(c.id)); S.fullDeck = S.fullDeck.filter(c=>!ids.has(c.id));
      S.cardsDestroyed += victims.length;
      renderPlay(); renderPiles();
      floatText($('#deckPile'), `−${victims.length} card${victims.length>1?'s':''}`, 'fire');
      if(op.onDestroyed){ const lbl = op.onDestroyed(victims.length); if(lbl) floatText(jel, lbl, 'chips'); }
      await wait(260);
    }
  }
}
async function collectRent(){
  const snap = S.stash.slice(); if(!snap.length) return;
  toast(`🧾 The Taxman collects vault rent: $2 × ${snap.length} stashed`, 2400);
  for(const j of snap){
    if(!S.stash.includes(j)) continue;
    if(S.money >= 2){
      S.money -= 2; sfx('tax'); const el = jokerEl(j.uid);
      floatText(el, '−$2 rent', 'money'); burstAt(el, COL.gold, 8, 3);
      $('#moneyVal').textContent = '$'+S.money; popEl($('#moneyVal'));
    } else {
      const victim = pick(S.stash), el = jokerEl(victim.uid);
      sfx('burn'); burstAt(el, COL.fire, 40, 6); floatText(el, 'REPOSSESSED', 'fire');
      if(el) await el.animate([{transform:'scale(1)',opacity:1},{transform:'scale(.1) rotate(30deg)',opacity:0}],{duration:500/Settings.speed,fill:'forwards'}).finished;
      S.stash.splice(S.stash.indexOf(victim), 1);
      toast(`🧾 Couldn't pay rent — ${JK[victim.id].name} was destroyed!`, 2800);
      flip(()=>renderJokers());
    }
    await wait(260);
  }
}
async function voidDrain(){
  const n = Math.min(S.stash.length, S.hand.length); if(!n) return;
  const victims = shuffle(S.hand.slice()).slice(0, n);
  sfx('voidd');
  const els = victims.map(c=>document.querySelector(`#hand [data-card="${c.id}"]`));
  els.forEach(el=>burstAt(el, COL.purple, 16, 4));
  floatText($('#playZone'), `🕳 The Void swallows ${n} card${n>1?'s':''}`, 'void');
  await flyTo(els, $('#playZone'), {scale:.05, fade:true, dur:520});
  victims.forEach(c=>S.selected.delete(c.id));
  S.hand = S.hand.filter(c=>!victims.includes(c)); S.discardPile.push(...victims);
  renderHand(); renderPiles();
  await wait(200);
}

async function discardCards(){
  if(locked || S.phase!=='play' || S.discards<=0) return;
  const sel = S.hand.filter(c=>S.selected.has(c.id)); if(!sel.length) return;
  locked = true; renderControls();
  S.discards--; $('#discardsVal').textContent = S.discards; popEl($('#discardsVal'));
  sfx('discard');
  await flyTo(sel.map(c=>document.querySelector(`#hand [data-card="${c.id}"]`)), $('#discardPile'));
  S.hand = S.hand.filter(c=>!S.selected.has(c.id)); S.selected.clear(); S.discardPile.push(...sel);
  locked = false; drawCards();
}
async function useHandReroll(){
  if(locked || S.phase!=='play' || S.rerollTokens<=0 || !S.deck.length) return;
  locked = true; renderControls(); S.rerollTokens--;
  sfx('discard');
  await flyTo(S.hand.map(c=>document.querySelector(`#hand [data-card="${c.id}"]`)), $('#discardPile'));
  S.discardPile.push(...S.hand); S.hand = []; S.selected.clear();
  locked = false; drawCards(); toast('🔄 Fresh hand dealt — no discard spent');
}

function winRound(){
  const b = blindInfo();
  S.phase = 'cash'; curScoring = null;
  sfx('fanfare');
  for(let i=0;i<5;i++) setTimeout(()=>FX.burst(rand(innerWidth*.2,innerWidth*.8), rand(innerHeight*.2,innerHeight*.5), pick([COL.gold,COL.pink,COL.cyan,COL.green]), 36, 8), i*160);
  const interest = Math.min(5, Math.floor(S.money/5));
  const lines = [[`${b.name} defeated`, b.reward], [`Remaining hands (${S.hands} × $1)`, S.hands], [`Interest ($1 per $5, max $5)`, interest]];
  S.pendingCash = lines.reduce((a,l)=>a+l[1],0);
  $('#cashArea').innerHTML = `<div class="cashpanel">
      <h2 class="chroma">★ BLIND CLEARED ★</h2>
      <div class="cline" style="animation-delay:0s"><span>Score</span><span class="num" style="color:#fff">${fmt(S.roundScore)} / ${fmt(b.target)}</span></div>
      ${lines.map((l,i)=>`<div class="cline" style="animation-delay:${(i+1)*.25}s"><span>${l[0]}</span><span class="num">$${l[1]}</span></div>`).join('')}
      <button class="btn gold" id="cashBtn">Cash Out: $${S.pendingCash}</button></div>`;
  showView('cash'); renderSide(); renderJokers();
}
function cashOut(){
  S.money += S.pendingCash; sfx('coin'); burstAt($('#moneyVal'), COL.gold, 24, 5);
  S.blind++;
  if(S.blind > 2){ S.blind = 0; S.ante++; S.boss = pickBoss(S.boss); }
  if(S.ante > 8 && !S.endless && !S.wonShown){ S.wonShown = true; renderSide(); recordRun(true); showWin(); return; }
  openShop();
}

function rollOffers(n){
  const owned = new Set([...S.active, ...S.stash].map(j=>j.id));
  const out = [];
  for(let k=0;k<n;k++){
    if(Math.random() < .3){ const d = generateJoker(GEN.shopW); out.push({id:d.id, uid:uid()}); continue; }
    const pool = JOKERS.filter(d=>!owned.has(d.id) && !out.some(o=>o.id===d.id));
    if(!pool.length){ const d = generateJoker(GEN.shopW); out.push({id:d.id, uid:uid()}); continue; }
    const d = wpick(pool, d=>RARITY_WEIGHT[d.rarity]);
    out.push({id:d.id, uid:uid()});
  }
  return out;
}
const rollPlanet = () => pick(HAND_ORDER);
const activeSlotCost = () => 8 + 4*S.activeBought;
const stashSlotCost  = () => 5 + 3*S.stashBought;
const PLANET_COST = 3, HANDREROLL_COST = 3;

function openShop(resume){
  S.phase = 'shop'; selectedJoker = null; swapPending = null;
  if(!resume || !S.shop) S.shop = {jokers:rollOffers(3), planet:rollPlanet(), planetBought:false, rerollCost:5, packCost:6};
  showView('shop'); renderSide(); renderJokers(); renderShop();
  saveRun();
}
function renderShop(){
  const sh = S.shop, nb = blindInfo(), h = HANDS[sh.planet], lv = S.levels[sh.planet];
  const buyBtn = (kind, cost, dis, i='') => `<button class="btn gold" data-buy="${kind}" data-i="${i}" ${dis||S.money<cost?'disabled':''}>Buy $${cost}</button>`;
  $('#shopArea').innerHTML = `
    <div class="shophead"><h2 class="chroma">SHOP</h2>
      <div class="nextinfo">Next: <b>${nb.name}</b> · Ante ${S.ante} · target <b class="num">${fmt(nb.target)}</b>${nb.desc?`<br><span style="color:#ffb0c0">${nb.desc}</span>`:''}</div>
      <button class="btn green" id="rerollShopBtn" ${S.money<sh.rerollCost?'disabled':''}>Reroll $${sh.rerollCost}</button>
      <button class="btn play" id="nextRoundBtn">Next Round ▶</button>
    </div>
    <div class="shoprow"><div class="rowtag"><span>JOKERS</span></div>
      ${sh.jokers.map((o,i)=>`<div class="offer">${jokerHTML(o,'shop',i)}${buyBtn('joker', JK[o.id].cost, false, i)}</div>`).join('')}
      ${!sh.jokers.length?'<div class="nextinfo" style="flex:none">Sold out!</div>':''}
      <div class="offer"><div class="packcard"><div class="vicon">🤖</div><b>Mystery AI Joker</b><small>Synthesizes a brand-new procedural Joker. Better rarity odds.</small></div>${buyBtn('pack', sh.packCost)}</div>
    </div>
    <div class="shoprow"><div class="rowtag"><span>UPGRADES</span></div>
      <div class="offer"><div class="voucher vact"><div class="vicon">⚡</div><b>Active Slot +1</b><small>${S.activeSlots}/${MAX_ACTIVE} slots</small></div>
        ${S.activeSlots>=MAX_ACTIVE?'<button class="btn gold" disabled>MAX</button>':buyBtn('active', activeSlotCost())}</div>
      <div class="offer"><div class="voucher vstash"><div class="vicon">🔒</div><b>Stash Slot +1</b><small>${S.stashSlots}/${MAX_STASH} vault slots</small></div>
        ${S.stashSlots>=MAX_STASH?'<button class="btn gold" disabled>MAX</button>':buyBtn('stash', stashSlotCost())}</div>
      <div class="offer"><div class="voucher vplanet"><div class="vicon">🪐</div><b>${h.planet}</b><small>${sh.planetBought?'Used!':`${sh.planet} lvl.${lv}→${lv+1}<br>+${h.lc} chips +${h.lm} mult`}</small></div>
        ${buyBtn('planet', PLANET_COST, sh.planetBought)}</div>
      <div class="offer"><div class="voucher vreroll"><div class="vicon">🔄</div><b>Hand Reroll</b><small>Redraw your whole hand mid-round. Held: ${S.rerollTokens}</small></div>
        ${buyBtn('handreroll', HANDREROLL_COST)}</div>
    </div>`;
  sizeShop();
}
function canPlace(){ return S.active.length < S.activeSlots ? 'active' : (S.stash.length < S.stashSlots ? 'stash' : null); }
function buy(kind, i){
  const sh = S.shop;
  const pay = c => { if(S.money < c){ toast('Not enough cash'); sfx('error'); return false; } S.money -= c; return true; };
  if(kind==='joker'){
    const o = sh.jokers[i]; if(!o) return;
    const d = JK[o.id], zone = canPlace();
    if(!zone){ toast('No room! Sell a Joker or buy a slot upgrade'); sfx('error'); return; }
    if(!pay(d.cost)) return;
    sfx('buy');
    flip(()=>{ sh.jokers.splice(i,1); S[zone].push({id:o.id, uid:o.uid}); renderJokers(); renderShop(); renderSide(); });
    const el = jokerEl(o.uid); el?.classList.add(zone==='active'?'arrive-active':'arrive-stash');
    floatText(el, zone==='active'?'Active!':'Stashed', zone==='active'?'active':'stash'); burstAt(el, zone==='active'?COL.gold:COL.purple, 24, 5);
    if(zone==='stash') toast('Active slots full — new Joker went into the Stash');
  } else if(kind==='pack'){
    if(!canPlace()){ toast('No room for a new Joker! Sell one or buy a slot first'); sfx('error'); return; }
    if(!pay(sh.packCost)) return;
    sh.packCost += 2; renderShop(); renderSide();
    openPack();
  } else if(kind==='active'){
    if(S.activeSlots>=MAX_ACTIVE || !pay(activeSlotCost())) return;
    S.activeSlots++; S.activeBought++; sfx('buy');
    renderJokers(); renderShop(); renderSide(); burstAt($('#activeZone'), COL.gold, 40, 7);
    $('#activeZone').animate([{boxShadow:'0 0 0 4px var(--gold), 0 0 40px var(--gold)'},{boxShadow:'none'}],{duration:900});
    toast(`⚡ Active Joker slots: ${S.activeSlots}`);
  } else if(kind==='stash'){
    if(S.stashSlots>=MAX_STASH || !pay(stashSlotCost())) return;
    S.stashSlots++; S.stashBought++; sfx('buy');
    renderJokers(); renderShop(); renderSide(); burstAt($('#stashZone'), COL.purple, 40, 7);

/* =====================================================================
   12. JOKER MANAGEMENT (active <-> stash), incl. Locksmith rules
   ===================================================================== */
function canManage(){
  if(locked){ toast('Wait for the hand to finish scoring'); sfx('error'); return false; }
  return ['play','shop','cash'].includes(S.phase);
}
function chainedBlock(u){
  const loc = locate(u);
  if(loc && loc[0]==='stash' && stashChained()){ toast('⛓ The Locksmith has chained your Stash until this blind is beaten'); sfx('lock'); const el = jokerEl(u); if(el) el.classList.add('shake'), setTimeout(()=>el.classList.remove('shake'),450); return true; }
  return false;
}
function notifyMove(j, zone){ const d = JK[j.id]; if(d && d.onMove) d.onMove(j, zone); }
function afterMove(u, fromZone){
  const loc = locate(u); if(!loc) return;
  const el = jokerEl(u);
  if(loc[0] !== fromZone){
    notifyMove(S[loc[0]][loc[1]], loc[0]);
    el?.classList.add(loc[0]==='stash'?'arrive-stash':'arrive-active');
    floatText(el, loc[0]==='stash'?'🔒 Stashed':'⚡ Active!', loc[0]==='stash'?'stash':'active');
    burstAt(el, loc[0]==='stash'?COL.purple:COL.gold, 18, 4.5);
    sfx(loc[0]==='stash'?'stash':'activate');
    if(S.phase==='play'){ renderJokers(); jokerEl(u)?.classList.add(loc[0]==='stash'?'arrive-stash':'arrive-active'); }
  }
  if(S.phase==='shop') saveRun();
}
function dropJoker(u, zone, targetUid){
  if(!canManage()) return;
  const from = locate(u); if(!from) return;
  const [fz, fi] = from;
  if(chainedBlock(u)) return;
  if(targetUid && locate(targetUid) && locate(targetUid)[0]==='stash' && stashChained() && fz!=='stash' && S.stash.length>=S.stashSlots){ chainedBlock(targetUid); return; }
  const fromArr = S[fz], toArr = S[zone];
  if(fz === zone){
    if(zone==='stash' && stashChained()){ chainedBlock(u); return; }
    flip(()=>{ const [j] = fromArr.splice(fi,1); const ti = targetUid ? fromArr.findIndex(x=>x.uid===targetUid) : -1; fromArr.splice(ti<0?fromArr.length:ti, 0, j); renderJokers(); });
    sfx('select'); return;
  }
  const cap = zone==='active' ? S.activeSlots : S.stashSlots;
  if(toArr.length < cap){
    flip(()=>{ const [j] = fromArr.splice(fi,1); const ti = targetUid ? toArr.findIndex(x=>x.uid===targetUid) : -1; if(ti>=0) toArr.splice(ti,0,j); else toArr.push(j); renderJokers(); });
    afterMove(u, fz);
  } else if(targetUid){ swapJokers(u, targetUid); }
  else { toast(`${zone==='active'?'Active':'Stash'} is full — drop onto a Joker to swap`); sfx('error'); }
}
function swapJokers(a, b){
  const la = locate(a), lb = locate(b); if(!la || !lb || la[0]===lb[0]) return;
  if(chainedBlock(la[0]==='stash'?a:b)) return;
  flip(()=>{ const ja = S[la[0]][la[1]], jb = S[lb[0]][lb[1]]; S[la[0]][la[1]] = jb; S[lb[0]][lb[1]] = ja; renderJokers(); });
  afterMove(a, la[0]); afterMove(b, lb[0]);
}
function onJokerClick(u){
  if(performance.now() < suppressJokerClickUntil) return;
  if(swapPending){
    const a = locate(swapPending), b = locate(u);
    if(a && b && a[0] !== b[0]){ if(!canManage()) return; const p = swapPending; swapPending = null; selectedJoker = null; swapJokers(p, u); renderJokers(); return; }
    swapPending = null;
  }
  selectedJoker = selectedJoker===u ? null : u;
  sfx('select'); renderJokers();
}
function jokerAction(act){
  if(act==='cancelswap'){ swapPending = null; renderJokers(); return; }
  if(act==='close'){ selectedJoker = null; renderJokers(); return; }
  const loc = selectedJoker && locate(selectedJoker); if(!loc) return;
  if(!canManage()) return;
  const [z,i] = loc, arr = S[z], u = selectedJoker;
  if(chainedBlock(u)) return;
  if(act==='move'){
    const to = z==='active' ? 'stash' : 'active', cap = to==='active' ? S.activeSlots : S.stashSlots;
    if(S[to].length < cap){ selectedJoker = null; dropJoker(u, to, null); renderJokers(); }
    else { swapPending = u; selectedJoker = null; renderJokers(); toast(`${to==='active'?'Active':'Stash'} is full — tap a Joker there to swap`); }
  } else if(act==='left' && i>0){ flip(()=>{ [arr[i-1],arr[i]] = [arr[i],arr[i-1]]; renderJokers(); }); sfx('select'); }
  else if(act==='right' && i<arr.length-1){ flip(()=>{ [arr[i+1],arr[i]] = [arr[i],arr[i+1]]; renderJokers(); }); sfx('select'); }
  else if(act==='sell'){
    const j = arr[i], v = sellValue(j), el = jokerEl(u);
    S.money += v; sfx('coin'); floatText(el, '+$'+v, 'money'); burstAt(el, COL.gold, 20, 5);
    selectedJoker = null;
    if(el) el.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.3) rotate(25deg)'}],{duration:280,fill:'forwards'});
    setTimeout(()=>{ const k = arr.indexOf(j); if(k>=0) arr.splice(k,1);
      flip(()=>{ renderJokers(); renderSide(); if(S.phase==='shop') renderShop(); }); popEl($('#moneyVal')); if(S.phase==='shop') saveRun(); }, 270);
  }
}

// Multi-touch swipe selection on the hand (each finger paints add/remove)
const paint = new Map();
document.addEventListener('pointerdown', e=>{
  SFX.unlock();
  const c = e.target.closest && e.target.closest('#hand .card');
  if(c && S && S.phase==='play' && !locked){
    e.preventDefault();
    const id = c.dataset.card, mode = S.selected.has(id) ? 'remove' : 'add';
    paint.set(e.pointerId, {mode, seen:new Set([id])});
    setSel(id, mode==='add');
    return;
  }
  const jk = e.target.closest && e.target.closest('#activeZone .joker, #stashZone .joker');
  if(jk) drag = {uid:jk.dataset.uid, el:jk, x0:e.clientX, y0:e.clientY, started:false, pid:e.pointerId};
}, {passive:false});
let drag = null;
document.addEventListener('pointermove', e=>{
  const p = paint.get(e.pointerId);
  if(p){
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const c = el && el.closest('#hand .card');
    if(c && !p.seen.has(c.dataset.card)){ p.seen.add(c.dataset.card); setSel(c.dataset.card, p.mode==='add'); }
    return;
  }
  if(!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if(!drag.started){
    if(Math.hypot(dx,dy) < 10) return;
    if(locked || !['play','shop','cash'].includes(S.phase)){ drag = null; return; }
    if(chainedBlock(drag.uid)){ drag = null; return; }
    drag.started = true;
    const r = drag.el.getBoundingClientRect(), g = drag.el.cloneNode(true);
    g.classList.add('ghost'); g.style.cssText += `;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;--jw:${r.width}px;--jh:${r.height}px`;
    document.body.appendChild(g); drag.ghost = g; drag.el.style.opacity = '.3'; sfx('select');
  }
  drag.ghost.style.transform = `translate(${dx}px,${dy}px) rotate(${Math.max(-12,Math.min(12,dx*.03))}deg) scale(1.08)`;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const z = under && under.closest('.zone');
  $$('.zone').forEach(x=>x.classList.toggle('dragover', x===z));
});
function endPointer(e){
  paint.delete(e.pointerId);
  if(!drag || e.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  if(!d.started) return;
  suppressJokerClickUntil = performance.now() + 350;
  d.ghost.style.display = 'none';
  const t = e.type === 'pointercancel' ? null : document.elementFromPoint(e.clientX, e.clientY);
  d.ghost.remove(); d.el.style.opacity = '';
  $$('.zone').forEach(x=>x.classList.remove('dragover'));
  const zone = t && t.closest('.zone');
  if(zone){ const tj = t.closest('.joker'); selectedJoker = null; dropJoker(d.uid, zone.dataset.zone, tj && tj.dataset.uid !== d.uid ? tj.dataset.uid : null); renderJokers(); }
}
document.addEventListener('pointerup', endPointer);
document.addEventListener('pointercancel', endPointer);
document.addEventListener('keydown', e=>{
  if(e.key==='m' || e.key==='M'){ Settings.muted = !Settings.muted; applySettings(); return; }
  if(!S || S.phase!=='play' || $('#overlay').classList.contains('show')) return;
  if(e.key==='Enter') playHand();
  else if(e.key==='d' || e.key==='D') discardCards();
  else if(e.key==='r' || e.key==='R') useHandReroll();
});
// Block pinch / double-tap zoom and context menus (iPad Safari)
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));
document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false});
document.addEventListener('contextmenu', e=>{ if(!e.target.closest('#modal')) e.preventDefault(); });
document.addEventListener('touchmove', e=>{ if(!e.target.closest('#modal, input')) e.preventDefault(); }, {passive:false});
['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev, ()=>SFX.unlock(), {passive:true}));
let resizeT = null;
const onResize = () => { clearTimeout(resizeT); resizeT = setTimeout(()=>{ fitLayout(); if(S && S.phase!=='start'){ renderJokers(); if(S.phase==='shop') renderShop(); } }, 60); };
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', ()=>setTimeout(onResize, 250));
if(window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) saveRun(); });

/* =====================================================================
   15. BOOT
   ===================================================================== */
FX.init();
S = newState();
applySettings();
fitLayout();
renderAll(); setCalc('',0,0);
if(!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) $('#fsBtn').style.opacity = '.5';
showStart();
</script>
