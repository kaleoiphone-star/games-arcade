<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>11+ Mastery Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: one climbing column. Summit HUD on top, a mountain-shaped trail of 20 steps, then one challenge card at a time.
   Deliberately single-theme: a bright glacier-and-marigold alpine look that reads the same on any host background. */
:root{
  color-scheme: light;
  --snow:#eaf2f6;
  --card:#ffffff;
  --ink:#1b2a41;
  --ink-2:#2a3d5c;
  --ink-soft:#52627a;
  --mist:#cddbe5;
  --marigold:#f2a93b;
  --marigold-lt:#ffe1a8;
  --pine:#2d7a58;
  --pine-lt:#e2f3ea;
  --coral:#cf5a43;
  --coral-lt:#fbe8e3;
  --sand:#fff6e3;
  --maths:#2d6cb0; --english:#b0406f; --verbal:#6b4fc0; --nvr:#23795a;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px;
}
html,body{background:var(--snow);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--display);line-height:1.1;text-wrap:balance}

/* ---------- HUD ---------- */
.hud{background:var(--ink);color:#fff;padding:12px 16px 14px}
.hud-in{max-width:840px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--ink-2);display:grid;place-items:center;font-size:24px;flex:none;border:2px solid var(--marigold);padding:0}
.who{min-width:0;flex:1 1 120px}
.who .nm{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .tt{font-size:12px;color:#f7d49a;letter-spacing:.04em}
.lvlchip{font-family:var(--display);font-weight:800;background:var(--marigold);color:var(--ink);border-radius:999px;padding:3px 14px;font-size:17px;white-space:nowrap}
.stars{display:flex;align-items:center;gap:5px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.stars svg{width:22px;height:22px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.hbtn{background:var(--ink-2);border:1px solid #3e5679;border-radius:10px;padding:6px 11px;font-size:12px;font-weight:700;letter-spacing:.08em;color:#fff;min-height:38px}
.hbtn:hover{background:#34496b}
.hbtn.parent{background:#fff;color:var(--ink);border-color:#fff}
.meters{flex:1 1 260px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mlbl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#c7d4e4;font-variant-numeric:tabular-nums}
.mlbl b{color:#fff}
.bar{height:12px;background:var(--ink-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--marigold),#ffd684);border-radius:99px;transition:width .7s cubic-bezier(.3,1.4,.5,1)}
.bar.thin{height:6px}
.bar.thin>i{background:#8fd3b0}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.bdg{font-size:11px;font-weight:700;background:var(--ink-2);border:1px solid #3e5679;border-radius:99px;padding:2px 9px;color:#f7d49a;letter-spacing:.02em}
.bdg.none{color:#9fb0c6;font-weight:400}

/* ---------- page ---------- */
.wrap{max-width:840px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}

/* mountain trail */
.trailbox{background:var(--card);border:1px solid var(--mist);border-radius:var(--r);padding:12px 14px 10px;display:flex;flex-direction:column;gap:6px}
.trail{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;align-items:end;height:66px}
.node{border-radius:5px 5px 2px 2px;background:var(--mist);position:relative;display:flex;justify-content:center;align-items:flex-start}
.node span{font-size:9px;font-weight:700;color:var(--ink-soft);padding-top:2px;font-variant-numeric:tabular-nums}
.node.done{background:var(--pine)}
.node.done span{color:#fff}
.node.cur{background:var(--marigold)}
.node.cur span{color:var(--ink)}
.node.cur::after{content:"";position:absolute;top:-12px;left:50%;width:10px;height:10px;margin-left:-5px;background:var(--ink);border-radius:50% 50% 50% 0;transform:rotate(-45deg);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{top:-16px}}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.tiers span{border-top:3px solid var(--mist);padding-top:3px}
.tiers span.on{border-color:var(--marigold);color:var(--ink);font-weight:700}

/* challenge card */
.card{background:var(--card);border:1px solid var(--mist);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 3px 0 var(--mist)}
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);font-weight:700}
.ltitle{font-size:28px;font-weight:800}
.ltitle em{font-style:normal;color:var(--marigold);-webkit-text-stroke:0}
.subj{display:inline-flex;align-items:center;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#fff;border-radius:99px;padding:4px 12px;white-space:nowrap}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ink-soft)}
.pip{width:12px;height:12px;border-radius:50%;background:var(--mist)}
.pip.on{background:var(--pine)}
.ptag{align-self:flex-start;background:var(--sand);border:2px dashed var(--marigold);color:var(--ink);font-weight:700;border-radius:10px;padding:4px 12px;font-size:14px}
.qtext{font-size:21px;line-height:1.45;max-width:65ch}
.qtext b{background:linear-gradient(transparent 60%,var(--marigold-lt) 60%);padding:0 1px}
.quote{display:block;margin-top:10px;font-size:20px;font-style:italic;background:var(--snow);border-radius:10px;padding:10px 14px}
.triple{display:block;margin-top:10px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.03em}
.visual{display:flex;justify-content:center;overflow-x:auto}
.visual svg{max-width:100%;height:auto}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--mist);border-radius:14px;padding:12px 14px;min-height:64px;font-size:19px;transition:transform .12s,border-color .12s,background .12s;min-width:0}
.choice:hover:not(:disabled){border-color:var(--ink);transform:translateY(-2px)}
.choice .k{flex:none;width:32px;height:32px;border-radius:9px;background:var(--snow);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px}
.choice .v{min-width:0;flex:1;overflow-wrap:anywhere}
.choice.svgc{flex-direction:column;align-items:stretch;padding:10px}
.choice.svgc .v{display:flex;justify-content:center}
.choice.svgc svg{width:100%;max-width:120px;height:auto}
.choice.ok{border-color:var(--pine);background:var(--pine-lt)}
.choice.ok .k{background:var(--pine);color:#fff}
.choice.no{border-color:var(--coral);background:var(--coral-lt);opacity:.65;animation:shake .35s}
.choice:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (max-width:480px){.choices.text{grid-template-columns:1fr}.ltitle{font-size:24px}.qtext{font-size:19px}}

.fb{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:14px;padding:12px 14px}
.fb.ok{background:var(--pine-lt);border:2px solid var(--pine)}
.fb .msg{flex:1 1 200px;font-weight:700;font-size:17px}
.fb .msg small{display:block;font-weight:400;color:var(--ink-soft);font-size:14px}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:16px;min-height:48px;background:var(--ink);color:#fff}
.btn:hover{background:var(--ink-2)}
.btn.gold{background:var(--marigold);color:var(--ink)}
.btn.gold:hover{background:#f6b95a}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--ink)}
.btn.ghost:hover{background:var(--snow)}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}

.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:700;background:var(--sand);border-radius:99px;padding:6px 12px;font-variant-numeric:tabular-nums}
.streak .fl{display:inline-block;width:12px;height:16px;background:var(--marigold);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.speed{flex:1 1 220px;display:flex;flex-direction:column;gap:4px;min-width:0}
.speed .sl{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.speed .sb{height:10px;border-radius:99px;background:var(--snow);overflow:hidden;border:1px solid var(--mist)}
.speed .sb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#8fd3b0,var(--pine));border-radius:99px}
.linkbtn{background:none;border:0;padding:0;font-size:13px;color:var(--ink);text-decoration:underline;min-height:0}

/* Professor Paws */
.paws{display:flex;gap:14px;align-items:flex-start;background:var(--sand);border:2px solid #f0d49c;border-radius:var(--r);padding:14px}
.mascot{width:72px;height:72px;flex:none}
.bubble{min-width:0;flex:1;display:flex;flex-direction:column;gap:10px}
.bubble h3{font-size:19px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;animation:pop .3s ease-out}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--marigold);color:var(--ink);font-weight:700;display:grid;place-items:center;font-size:14px}
.steps li span{min-width:0;overflow-wrap:anywhere}
.pacts{display:flex;gap:8px;flex-wrap:wrap}
.abc{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.06em;color:var(--ink-soft);margin-top:4px;overflow-wrap:anywhere}
@keyframes pop{from{opacity:.2;transform:translateY(4px)}}

.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.82em;line-height:1.1;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}

/* svg shapes */
.tile-bg{fill:#fff;stroke:#9fb3c6;stroke-width:2}
.tile-q{fill:var(--snow);stroke:#9fb3c6;stroke-width:2;stroke-dasharray:6 5}
.qmark{font-family:var(--display);font-weight:800;font-size:44px;fill:var(--ink-soft)}
.f-solid{fill:var(--ink);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.f-hollow{fill:#fff;stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round}
.f-grey{fill:#9db2c7;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.dot{fill:var(--coral)}
.mirror{stroke:var(--coral);stroke-width:3;stroke-dasharray:8 6}
.dim{font-family:var(--body);font-size:13px;font-weight:700;fill:var(--ink)}
.netc{fill:#dcebf4;stroke:var(--ink);stroke-width:2}
.netl{font-family:var(--display);font-weight:800;font-size:13px;fill:var(--ink)}
.lshape{fill:#dcebf4;stroke:var(--ink);stroke-width:2.5}

/* modals */
.modal{position:fixed;inset:0;background:rgba(17,27,43,.6);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--card);border-radius:20px;max-width:600px;width:100%;max-height:calc(100% - 24px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h2{font-size:30px;font-weight:800}
.sheet h3{font-size:18px}
.sheet p{margin:0}
.sub{color:var(--ink-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:700;background:var(--snow);border:1px solid var(--mist);border-radius:99px;padding:4px 10px}
.chip.gold{background:var(--marigold-lt);border-color:var(--marigold)}
.hero-lvl{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;color:var(--marigold);-webkit-text-stroke:2px var(--ink)}
.newtier{background:var(--pine-lt);border:2px solid var(--pine);border-radius:12px;padding:12px 14px}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.inp{font:inherit;font-size:20px;padding:12px 14px;border-radius:12px;border:2px solid var(--mist);width:100%;background:#fff;color:var(--ink)}
.title-big{font-size:40px;font-weight:800;line-height:1}
.title-big span{color:var(--marigold);-webkit-text-stroke:1.5px var(--ink)}
.startart{display:flex;justify-content:center}
.startart svg{width:100%;max-width:380px;height:auto}

.grid-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gear{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--mist);border-radius:12px;padding:10px 6px;background:#fff;font-size:13px;text-align:center;min-height:96px}
.gear .gi{font-size:30px;line-height:1}
.gear.lock{opacity:.45;cursor:default}
.gear.eq{border-color:var(--marigold);background:var(--marigold-lt)}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--mist);border-radius:12px;padding:8px 12px;background:#fff;text-align:left}
.trow.eq{border-color:var(--marigold);background:var(--marigold-lt)}
.trow.lock{opacity:.5;cursor:default}
.trow small{color:var(--ink-soft);display:block;font-size:12px}

/* parent dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--snow);border-radius:12px;padding:10px 12px}
.kpi .n{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.srow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:14px}
.srow .tb{height:12px;background:var(--snow);border-radius:99px;overflow:hidden;border:1px solid var(--mist)}
.srow .tb i{display:block;height:100%}
.srow .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.list li small{display:block;color:var(--ink-soft)}
.danger{background:var(--coral-lt);color:var(--coral);border:2px solid var(--coral)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px);text-align:center;animation:pop .3s}
.toast b{color:var(--marigold)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="hud">
  <div class="hud-in">
    <div class="row">
      <button class="avatar" id="avatarBtn" aria-label="Open the Reward Treasury"><span id="gearIcon">🗺️</span></button>
      <div class="who"><div class="nm" id="pName">Climber</div><div class="tt" id="pTitle">Trainee Climber</div></div>
      <div class="lvlchip" id="lvlChip">Level 1</div>
      <div class="stars" title="Gold stars"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,1.5 15,8.6 22.7,9.2 16.8,14.2 18.6,21.8 12,17.7 5.4,21.8 7.2,14.2 1.3,9.2 9,8.6" fill="#f2a93b" stroke="#fff3d6" stroke-width="1.2"/></svg><span id="starCount">0</span></div>
    </div>
    <div class="row">
      <div class="meters">
        <div class="mlbl"><span>Level progress <b id="lvlProgTxt">0 / 5</b></span><span>XP <b id="xpTxt">0</b></span></div>
        <div class="bar"><i id="lvlBar"></i></div>
        <div class="mlbl"><span>Journey to Level 20</span><b id="journeyTxt">0%</b></div>
        <div class="bar thin"><i id="journeyBar"></i></div>
      </div>
      <div class="hbtns">
        <button class="hbtn" id="treasBtn">TREASURY</button>
        <button class="hbtn" id="soundBtn" aria-pressed="true">SOUND ON</button>
        <button class="hbtn parent" id="parentBtn">PARENT</button>
      </div>
    </div>
    <div class="badges" id="badgeRow"></div>
  </div>
</header>

<main class="wrap">
  <div class="trailbox" aria-label="Your climb from Level 1 to Level 20">
    <div class="trail" id="trail"></div>
    <div class="tiers" id="tiers"><span>1–5 Gentle</span><span>6–10 Momentum</span><span>11–15 Exam</span><span>16–20 Mastery</span></div>
  </div>

  <section class="card" id="card">
    <div class="lhead">
      <div>
        <div class="eyebrow" id="tierName">Gentle Foundations</div>
        <h1 class="ltitle" id="lvlTitle">Level 1: First Footsteps</h1>
      </div>
      <span class="subj" id="subj">Maths</span>
    </div>
    <div class="qmeta" id="qmeta"></div>
    <div class="ptag" id="ptag" hidden>Practice Step with Professor Paws</div>
    <div class="qtext" id="qtext"></div>
    <div class="visual" id="visual" hidden></div>
    <div class="choices" id="choices"></div>
    <div class="fb" id="fb" hidden></div>
    <div class="paws" id="paws" hidden>
      <svg class="mascot" viewBox="0 0 80 80" aria-hidden="true">
        <polygon points="13,34 17,9 34,22" fill="#e8964a" stroke="#1b2a41" stroke-width="2.5" stroke-linejoin="round"/>
        <polygon points="67,34 63,9 46,22" fill="#e8964a" stroke="#1b2a41" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="40" cy="46" r="27" fill="#f2b06a" stroke="#1b2a41" stroke-width="2.5"/>
        <ellipse cx="40" cy="57" rx="14" ry="10" fill="#fff4e3"/>
        <circle cx="29" cy="44" r="7.5" fill="#fff" stroke="#1b2a41" stroke-width="2.2"/>
        <circle cx="51" cy="44" r="7.5" fill="#fff" stroke="#1b2a41" stroke-width="2.2"/>
        <line x1="36.5" y1="44" x2="43.5" y2="44" stroke="#1b2a41" stroke-width="2.2"/>
        <circle cx="30" cy="45" r="3" fill="#1b2a41"/><circle cx="52" cy="45" r="3" fill="#1b2a41"/>
        <polygon points="37,53 43,53 40,57" fill="#cf5a43"/>
        <path d="M34,60 Q40,65 46,60" fill="none" stroke="#1b2a41" stroke-width="2" stroke-linecap="round"/>
        <path d="M14,54 L28,56 M14,60 L28,59 M66,54 L52,56 M66,60 L52,59" stroke="#1b2a41" stroke-width="1.4" stroke-linecap="round"/>
        <polygon points="16,21 40,11 64,21 40,31" fill="#1b2a41"/>
        <rect x="31" y="23" width="18" height="7" fill="#1b2a41"/>
        <path d="M40,21 L60,24 L60,33" fill="none" stroke="#f2a93b" stroke-width="2"/>
        <circle cx="60" cy="34" r="2.5" fill="#f2a93b"/>
      </svg>
      <div class="bubble" id="bubble"></div>
    </div>
    <div class="tools">
      <button class="btn ghost" id="hintBtn">Break It Down</button>
      <div class="streak" id="streak" hidden><span class="fl"></span><span id="streakTxt">Streak 0</span></div>
      <div class="speed" id="speed" hidden>
        <div class="sl"><span id="speedLbl">Speed bonus</span><button class="linkbtn" id="speedToggle">Hide speed meter</button></div>
        <div class="sb"><i id="speedFill"></i></div>
      </div>
      <button class="btn small ghost" id="speedOnBtn" hidden>Show speed meter</button>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

// Build four options: the correct value plus three distinct distractors.
function opts(correct,pool,show=fmt){
  const key=v=>String(v);
  const seen=new Set([key(correct)]),ds=[];
  for(const d of pool){
    if(d===undefined||d===null)continue;
    if(typeof d==='number'&&(!isFinite(d)||d<0||(Number.isInteger(correct)&&!Number.isInteger(d))))continue;
    const k=key(d); if(!seen.has(k)){seen.add(k);ds.push(d)}
    if(ds.length===3)break;
  }
  let k=1;
  while(ds.length<3&&typeof correct==='number'&&k<60){
    const c=correct+(k%2?Math.ceil(k/2):-Math.ceil(k/2)); k++;
    if(c>=0&&!seen.has(key(c))){seen.add(key(c));ds.push(c)}
  }
  const all=shuffle([correct,...ds]);
  return {choices:all.map(show),answer:all.indexOf(correct)};
}
const fromBank=(ans,wrongs)=>opts(ans,shuffle(wrongs),x=>x);

function shapeG(type,o={}){
  const {x=50,y=50,s=1,rot=0,mir=false,fill='solid'}=o;
  const cls=fill==='solid'?'f-solid':fill==='grey'?'f-grey':'f-hollow';
  return `<g class="${cls}" transform="translate(${x} ${y}) rotate(${rot}) scale(${mir?-s:s} ${s})">${SH[type]}</g>`;
}
const tileBg=(x=0,y=0)=>`<rect class="tile-bg" x="${x+2}" y="${y+2}" width="96" height="96" rx="10"/>`;
const tileQ=(x=0,y=0)=>`<rect class="tile-q" x="${x+2}" y="${y+2}" width="96" height="96" rx="10"/><text class="qmark" x="${x+50}" y="${y+66}" text-anchor="middle">?</text>`;
const svgWrap=(w,h,inner,maxw)=>`<svg viewBox="0 0 ${w} ${h}" style="width:${maxw||w}px" role="img" aria-label="diagram">${inner}</svg>`;
function frameG(f,x=0,y=0){
  let g=tileBg(x,y);
  const dots=f.dots||0;
  g+=shapeG(f.shape,{x:x+50,y:y+(dots?42:50),s:dots?.78:1,rot:f.rot||0,mir:!!f.mir,fill:f.fill||'solid'});
  for(let i=0;i<dots;i++){const cx=x+50-(dots-1)*6.5+i*13;g+=`<circle class="dot" cx="${cx}" cy="${y+84}" r="4.6"/>`}
  return g;
}
const tileSVG=f=>`<svg viewBox="0 0 100 100" role="img" aria-label="shape option">${frameG(f)}</svg>`;
function cellG(c,x,y){
  let g=tileBg(x,y);
  const pos={1:[[50,50]],2:[[30,50],[70,50]],3:[[30,34],[70,34],[50,70]]}[c.n];
  pos.forEach(([px,py])=>g+=shapeG(c.shape,{x:x+px,y:y+py,s:.58,fill:c.fill}));
  return g;
}
const cellSVG=c=>`<svg viewBox="0 0 100 100" role="img" aria-label="matrix option">${cellG(c,0,0)}</svg>`;
function netSVG(cells,letters){
  const s=17,xs=cells.map(c=>c[0]),ys=cells.map(c=>c[1]);
  const minx=Math.min(...xs),miny=Math.min(...ys),w=(Math.max(...xs)-minx+1)*s,h=(Math.max(...ys)-miny+1)*s;
  const ox=(110-w)/2,oy=(110-h)/2;
  let g='';
  cells.forEach((c,i)=>{const x=ox+(c[0]-minx)*s,y=oy+(c[1]-miny)*s;g+=`<rect class="netc" x="${x}" y="${y}" width="${s}" height="${s}"/>`;if(letters)g+=`<text class="netl" x="${x+s/2}" y="${y+s/2+4.5}" text-anchor="middle">${letters[i]}</text>`});
  return `<svg viewBox="0 0 110 110" role="img" aria-label="cube net">${g}</svg>`;
}
function tnet(cells){ // random rotation / reflection of a net
  let c=cells.map(p=>p.slice());
  const r=R(0,3); for(let k=0;k<r;k++)c=c.map(([x,y])=>[-y,x]);
  if(Math.random()<.5)c=c.map(([x,y])=>[-x,y]);
  return c;
}

    if(!o||!o.choices||o.choices.length!==4||o.answer<0||new Set(o.choices).size!==4)continue;
    if(recentQ.includes(o.q+o.choices.join())&&i<6)continue;
    return {topic:t.key,topicName:t.name,subject:t.subject,level:L,...o};
  }
  return null;
}
function subjectsFor(L){return L<6?['Maths','English','Verbal']:['Maths','English','Verbal','NVR']}
function newQuestion(){
  const L=state.level,subs=subjectsFor(L),sub=subs[state.qi%subs.length];state.qi++;
  const pool=T.filter(t=>t.subject===sub&&L>=t.min&&L<=t.max&&t.key!==state.lastTopic[sub]);
  let q=null,g=0;
  while(!q&&g++<10){let tot=0;const w=pool.map(t=>{const x=1+2*(t.min/L);tot+=x;return x});let r=Math.random()*tot,k=0;while(r>w[k]){r-=w[k];k++}q=build(pool[Math.min(k,pool.length-1)],L)}
  if(!q)q=build(TMAP.m_add,L);
  state.lastTopic[sub]=q.topic;recentQ.push(q.q+q.choices.join());if(recentQ.length>40)recentQ.shift();
  return q;
}
function practiceFor(q){const t=TMAP[q.topic],L=Math.max(t.min,q.level-2);let p=null;for(let i=0;i<5&&(!p||p.q===q.q);i++)p=build(t,L);return p||build(TMAP.m_add,1)}

// ================= flow =================
let speedRAF=0;

function lockChoices(){cur.locked=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true)}
function showFb(html,btn,fn){const f=$('#fb');f.className='fb ok';f.hidden=false;f.innerHTML=`<div class="msg">${html}</div><button class="btn gold" id="fbBtn">${btn}</button>`;const b=$('#fbBtn');b.onclick=()=>{SFX.tap();fn()};setTimeout(()=>b.focus({preventScroll:false}),60)}
function showPaws(q,mode){
  const p=$('#paws'),bub=$('#bubble');p.hidden=false;
  let n=mode==='hint'?cur.hint:q.steps.length;
  const title=mode==='hint'?'Professor Paws breaks it down':mode==='wrong'?"Not quite. Let's break it down together.":"Nearly! Let's look at it again.";
  let acts='';

function startPractice(){SFX.tap();cur.pq=practiceFor(cur.q);cur.mode='practice';cur.pdis=new Set();render();stopSpeed(true)}
function recordAttempt(q,ok,t){
  const s=state.stats;s.answered++;if(ok)s.firstTryCorrect++;t=Math.min(t,180);s.time+=t;
  const b=s.bySubject[q.subject]||(s.bySubject[q.subject]={a:0,c:0,t:0});b.a++;b.c+=ok?1:0;b.t+=t;
  const tp=s.byTopic[q.topic]||(s.byTopic[q.topic]={n:q.topicName,s:q.subject,a:0,c:0,t:0});tp.a++;tp.c+=ok?1:0;tp.t+=t;
}
function onAnswer(i){
  if(!cur||cur.locked)return;
  const q=shown(),ok=i===q.answer,btn=document.querySelector(`.choice[data-i="${i}"]`);
  if(!btn||btn.disabled)return;
  const t=(performance.now()-cur.t0)/1000;
  if(cur.mode==='practice'){
    if(ok){btn.classList.add('ok');lockChoices();SFX.ding();setTimeout(SFX.star,180);burstAt(btn);state.stats.practiceDone++;state.stars++;state.xp+=5;$('#paws').hidden=true;
      const nb=checkBadges();save();updateHUD();
      showFb(`You've got it! +1 star<small>Now try the original question again. You're ready.</small>`,'Back to the question',()=>{cur.mode='retry';render()});toastBadges(nb);}
    else{btn.classList.add('no');btn.disabled=true;cur.pdis.add(i);SFX.soft();showPaws(q,'again')}
    return;
  }
  const first=cur.mode==='main'&&!cur.failed;
  if(first)recordAttempt(q,ok,t);
  if(ok){
    const speedWon=first&&cur.speedActive&&cur.speedLeft>0;stopSpeed();
    btn.classList.add('ok');lockChoices();$('#paws').hidden=true;$('#hintBtn').hidden=true;
    const gain=first?15:8;state.xp+=gain;let stars=1;const extras=[];
    state.streak++;state.bestStreak=Math.max(state.bestStreak,state.streak);
    if(state.level>=6&&state.streak%3===0){stars++;extras.push(`${state.streak} in a row: bonus star!`)}
    if(speedWon){stars++;state.stats.speedBonuses++;extras.push('Speed bonus star!')}
    state.stars+=stars;state.correctBy[q.subject]++;state.correctTotal++;state.progress++;
    if(!state.lv.skills.includes(q.topicName))state.lv.skills.push(q.topicName);

    const done=state.progress>=need(state.level);
    showFb(`${pick(PRAISE)} +${stars} star${stars>1?'s':''} · +${gain} XP${extras.length?`<small>${extras.join(' ')}</small>`:''}`,done?'Finish the level':'Next question',done?levelUp:nextQuestion);
    toastBadges(nb);
  }else{
    cur.failed=true;cur.dis.add(i);state.streak=0;stopSpeed(true);
    btn.classList.add('no');btn.disabled=true;lockChoices();SFX.soft();
    $('#streakTxt').textContent='Streak 0';$('#hintBtn').hidden=true;
    showPaws(q,'wrong');save();
    setTimeout(()=>$('#paws').scrollIntoView({behavior:reduced?'auto':'smooth',block:'nearest'}),80);
  }
}

      <div class="kpi"><div class="n">${state.finished?'20 ✓':state.level}</div><div class="l">Level reached</div></div>
      <div class="kpi"><div class="n">${acc}%</div><div class="l">First-try accuracy</div></div>
      <div class="kpi"><div class="n">${s.answered}</div><div class="l">Questions answered</div></div>
      <div class="kpi"><div class="n">${avg}${s.answered?'s':''}</div><div class="l">Avg time per question</div></div>
      <div class="kpi"><div class="n">${s.hints}</div><div class="l">Hints used</div></div>
      <div class="kpi"><div class="n">${s.practiceDone}</div><div class="l">Practice steps done</div></div>
      <div class="kpi"><div class="n">${state.bestStreak}</div><div class="l">Best streak</div></div>
      <div class="kpi"><div class="n">${s.speedBonuses}</div><div class="l">Speed bonuses</div></div>
    </div>
    <div><h3>By subject</h3><p class="sub" style="font-size:13px">First-try accuracy and average seconds per question.</p><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">${subRows}</div></div>
    <div><h3>Core strengths</h3>${strong.length?`<ul class="list" style="margin-top:6px">${strong.map(t=>`<li><b>${t.n}</b> <small>${Math.round(t.acc*100)}% over ${t.a} questions (${SUBJ[t.s].name})</small></li>`).join('')}</ul>`:'<p class="sub">Strengths appear once a topic has at least 3 answers at 80% or better.</p>'}</div>
    <div><h3>Areas to target</h3>${weak.length?`<ul class="list" style="margin-top:6px">${weak.map(t=>`<li><b>${t.n}</b> <small>${Math.round(t.acc*100)}% over ${t.a} questions. Try this: ${REC[t.k]||'Revisit the worked steps from Professor Paws.'}</small></li>`).join('')}</ul>`:'<p class="sub">No weak spots yet. Topics appear here when accuracy drops below 70% over 2 or more questions.</p>'}</div>
    ${sp?`<div><h3>Speed</h3><p class="sub">Slowest topic so far: <b>${sp.n}</b> at ${(sp.t/sp.a).toFixed(0)}s per question. Levels 11–20 build exam pace with an optional speed meter; accuracy comes first.</p></div>`:''}
    <p class="sub" style="font-size:13px">Accuracy counts only the first answer to each question. Progress is saved in this browser only.</p>
    <div class="acts"><button class="btn small ghost danger" data-act="reset1">Reset progress</button><button class="btn gold" data-act="close">Close</button></div>`,onClose);
}

// ================= boot =================
function boot(data){
  if(data&&data.state&&data.state.name){state=data.state;updateHUD();nextQuestion();return}
  showStart();
}
window.claude?.hot?.snapshot?.(()=>({state}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>

<p id="arcade-back" style="margin:0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));text-align:center;font:600 15px/1.4 system-ui,-apple-system,sans-serif"><a href="../" style="color:inherit;opacity:.8;text-decoration:underline;text-underline-offset:3px">Back to the Games Arcade</a></p>
